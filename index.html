
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINI WORLD</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #91d9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      max-width: 100%;
      max-height: 100vh;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
<script>
class GameScene extends Phaser.Scene {
  constructor() {
    super("GameScene");
  }

  create() {
    this.add.rectangle(400, 300, 800, 600, 0x91d9ff);

    // 구름
    for (let i = 0; i < 6; i++) {
      const x = 80 + i * 145;
      this.add.circle(x, 90 + (i % 2) * 35, 25, 0xffffff);
      this.add.circle(x + 25, 90 + (i % 2) * 35, 32, 0xffffff);
      this.add.circle(x + 55, 90 + (i % 2) * 35, 23, 0xffffff);
    }

    // 바닥
    this.platforms = this.physics.add.staticGroup();
    this.platforms.create(400, 570, null)
      .setDisplaySize(800, 60)
      .setTint(0x55c96b)
      .refreshBody();

    // 발판
    const p1 = this.add.rectangle(280, 440, 150, 20, 0x55c96b);
    const p2 = this.add.rectangle(520, 330, 150, 20, 0x55c96b);
    this.physics.add.existing(p1, true);
    this.physics.add.existing(p2, true);
    this.platforms.add(p1);
    this.platforms.add(p2);

    // 고양이
    this.cat = this.add.container(120, 500);
    const body = this.add.rectangle(0, 0, 34, 42, 0xffa33b);
    const ear1 = this.add.triangle(-12, -23, -9, 10, 0, -10, 9, 10, 0xffa33b);
    const ear2 = this.add.triangle(12, -23, -9, 10, 0, -10, 9, 10, 0xffa33b);
    const eye1 = this.add.circle(-7, -3, 3, 0x333333);
    const eye2 = this.add.circle(7, -3, 3, 0x333333);
    const nose = this.add.triangle(0, 5, -4, 0, 4, 0, 0, 5, 0xff7777);
    this.cat.add([body, ear1, ear2, eye1, eye2, nose]);

    this.physics.add.existing(this.cat);
    this.cat.body.setSize(30, 40);
    this.cat.body.setCollideWorldBounds(true);
    this.cat.body.setGravityY(900);

    this.physics.add.collider(this.cat, this.platforms);

    this.keys = this.input.keyboard.addKeys(
      "LEFT,RIGHT,A,D,SPACE,UP"
    );

    this.add.text(20, 20,
      "MINI WORLD", {
        fontSize: "28px",
        color: "#ffffff",
        fontStyle: "bold",
        stroke: "#333333",
        strokeThickness: 4
      }
    );

    this.add.text(20, 555,
      "이동: A / D 또는 방향키   점프: SPACE", {
        fontSize: "16px",
        color: "#ffffff",
        stroke: "#333333",
        strokeThickness: 3
      }
    );
  }

  update() {
    const body = this.cat.body;
    body.setVelocityX(0);

    if (this.keys.LEFT.isDown || this.keys.A.isDown) {
      body.setVelocityX(-230);
    } else if (this.keys.RIGHT.isDown || this.keys.D.isDown) {
      body.setVelocityX(230);
    }

    if (
      (Phaser.Input.Keyboard.JustDown(this.keys.SPACE) ||
       Phaser.Input.Keyboard.JustDown(this.keys.UP)) &&
      body.blocked.down
    ) {
      body.setVelocityY(-450);
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  pixelArt: true,
  physics: {
    default: "arcade",
    arcade: { debug: false }
  },
  scene: GameScene
};

new Phaser.Game(config);
</script>
</body>
</html>
